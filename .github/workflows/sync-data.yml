    - name: Build chunked JSON files
      run: |
        python3 << 'EOF'
        import os, json
        from glob import glob
        from math import ceil

        DATA_DIR = "external_data"
        OUTPUT_DIR = "data"
        CHUNK = 600

        os.makedirs(OUTPUT_DIR, exist_ok=True)

        # -------------------------
        # Load cards
        # -------------------------
        card_files = glob(f"{DATA_DIR}/cards/**/*.json", recursive=True)
        cards = []

        for f in card_files:
            with open(f, "r") as fp:
                try:
                    card = json.load(fp)
                    if isinstance(card, dict):
                        cards.append(card)
                except:
                    pass

        print(f"Loaded {len(cards)} cards")

        # -------------------------
        # Load sets (some are arrays!)
        # -------------------------
        set_files = glob(f"{DATA_DIR}/sets/*.json")
        sets = []

        for f in set_files:
            with open(f, "r") as fp:
                try:
                    data = json.load(fp)

                    # Case 1: single set as dict
                    if isinstance(data, dict):
                        sets.append(data)

                    # Case 2: file contains a list of sets
                    elif isinstance(data, list):
                        for s in data:
                            if isinstance(s, dict):
                                sets.append(s)

                except:
                    pass

        # Sort sets safely
        def safe_release(s):
            return s.get("releaseDate") or "9999-99-99"

        sets = [s for s in sets if isinstance(s, dict)]
        sets.sort(key=safe_release)

        # -------------------------
        # Write card-sets.json
        # -------------------------
        with open(f"{OUTPUT_DIR}/card-sets.json", "w") as fp:
            json.dump(sets, fp)

        print(f"Saved {len(sets)} sets")

        # -------------------------
        # Chunk cards
        # -------------------------
        total = len(cards)
        chunks = ceil(total / CHUNK)

        for i in range(chunks):
            chunk_cards = cards[i*CHUNK:(i+1)*CHUNK]
            with open(f"{OUTPUT_DIR}/tcg-cards-chunk-{i+1}.json", "w") as fp:
                json.dump({"cards": chunk_cards}, fp)

        # -------------------------
        # Write index
        # -------------------------
        index_data = {
            "total_cards": total,
            "total_chunks": chunks,
            "chunk_size": CHUNK
        }

        with open(f"{OUTPUT_DIR}/tcg-cards-index.json", "w") as fp:
            json.dump(index_data, fp)

        print(f"Generated {chunks} chunks, {total} cards.")

        EOF
