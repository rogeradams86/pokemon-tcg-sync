name: Daily Pokemon TCG Data Update

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"   # Runs daily at 06:00 UTC

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  update-pokemon-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure UTF-8 locale
        run: |
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"

      - name: Create data directory
        run: mkdir -p data

      # --------------------------
      # FETCH CARD DATA
      # --------------------------
      - name: Fetch Pokémon card data → data/raw-cards.json
        run: |
          if [ ! -f scripts/fetch-cards.js ]; then
            echo "scripts/fetch-cards.js not found"
            exit 1
          fi

          node scripts/fetch-cards.js

          if [ ! -s data/raw-cards.json ]; then
            echo "raw-cards.json missing or empty"
            exit 1
          fi

          node -e "const j=JSON.parse(require('fs').readFileSync('data/raw-cards.json','utf8'));console.log('Sets:',j.sets?.length||0,'Cards:',Array.isArray(j.cards)?j.cards.length:(Array.isArray(j)?j.length:0));"

      # Build cards-all.json adapter
      - name: Build cards-all.json adapter
        run: |
          node -e "
            const fs=require('fs');
            const raw=JSON.parse(fs.readFileSync('data/raw-cards.json','utf8'));
            const arr = Array.isArray(raw)
              ? raw
              : Array.isArray(raw.cards)
                ? raw.cards
                : [];
            if (!Array.isArray(arr) || arr.length === 0) {
              console.error('No valid cards found');
              process.exit(1);
            }
            fs.writeFileSync('data/cards-all.json', JSON.stringify(arr,null,2));
            console.log('cards-all.json size:', arr.length);
          "

      # --------------------------
      # FETCH PRICING
      # --------------------------
      - name: Fetch pricing → data/pricing-raw.json
        run: |
          if [ -f tcgcsv-scraper.js ]; then
            echo "Using tcgcsv-scraper.js"
            node tcgcsv-scraper.js
          elif [ -f scripts/fetch-pricing.js ]; then
            echo "Using scripts/fetch-pricing.js"
            node scripts/fetch-pricing.js
          else
            echo "No pricing script found, skipping."
            touch data/pricing-raw.json
            echo '{"pricing":{}}' > data/pricing-raw.json
          fi

          if [ ! -s data/pricing-raw.json ]; then
            echo "pricing-raw.json missing or empty, writing empty structure"
            echo '{"pricing":{}}' > data/pricing-raw.json
          fi

          node -e "const j=JSON.parse(require('fs').readFileSync('data/pricing-raw.json','utf8'));console.log('Pricing entries:', j.pricing ? Object.keys(j.pricing).length : 0);"

      # --------------------------
      # MERGE CARDS + PRICING
      # --------------------------
      - name: Merge card + pricing → chunks + summary.json
        run: |
          if [ ! -f scripts/merge-data.js ]; then
            echo "scripts/merge-data.js not found"
            exit 1
          fi

          node scripts/merge-data.js

          # Force a summary.json (merge-data.js does not create it)
          node -e "
            const fs = require('fs');
            const idx = JSON.parse(fs.readFileSync('data/tcg-cards-index.json','utf8'));
            const summary = {
              lastUpdated: new Date().toISOString(),
              totalCards: idx.totalCards,
              cardsWithPricing: idx.cardsWithPricing,
              chunks: idx.chunks
            };
            fs.writeFileSync('data/summary.json', JSON.stringify(summary,null,2));
          "

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily TCG data update - $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: |
            data/**
            summary.json
          retention-days: 7
